# polsia.toml — Polsia deploy manifest for this Next.js + Prisma app.
#
# Read SERVER-SIDE by Polsia's deploy pipeline at the deployed commit to drive
# how this app is built, started, health-checked and given its listen port.
# Parsing is fail-open per field: a missing/invalid field falls back to the
# platform default for that field, so a mistake here never blocks a deploy.
#
# AGENT: you OWN this file ONLY to declare scheduled work — append [[crons]]
# blocks (see the commented example). Do NOT change build / start /
# healthcheck_path / port_env_var: they mirror the verified platform manifest
# for this template and a wrong value silently degrades the deploy.

runtime = "node"

# next build typechecks with the devDependency toolchain (typescript, @types)
# that a production install would omit — hence --include=dev. postinstall runs
# `prisma generate`, so the client is ready before the build.
build = "npm install --include=dev && npm run build"

# Schema-only template (prisma/schema/, no migrations dir): materialize the
# schema at start with an idempotent `prisma db push` (fast no-op once it
# matches), then boot Next. --skip-generate: client already generated by the
# build's postinstall. --accept-data-loss: non-interactive.
start = "npx prisma db push --skip-generate --accept-data-loss && npm start"

# The deploy pipeline's readiness probe hits this route (src/app/health/route.ts).
healthcheck_path = "/health"

# Next reads its listen port from PORT; the hosting provider sets it.
port_env_var = "PORT"

# DATABASE_URL is resolved from the provisioned Postgres (rdbms capability) and
# injected into the build AND runtime env. It must be PRESENT at build time:
# next.config.ts loads src/lib/env.ts, which Zod-validates env presence.
[env]
DATABASE_URL = { source = "rdbms" }

# Scheduled work — APPEND a block per recurring job (no in-process schedulers).
# Each command runs in a fresh checkout. `dependencies` installs extra npm
# packages for that job only. Example:
#
# [[crons]]
# name = "daily-digest"          # kebab, /^[a-z][a-z0-9-]{0,62}$/, unique
# schedule = "0 9 * * *"          # 5-field POSIX cron
# command = "node jobs/daily-digest.js"
# dependencies = ["pdfkit"]       # optional

# AWS asset discovery drain — picks up queued AwsDiscoveryRun rows and runs
# them through @aws-sdk/{sts,ec2,s3,iam,config-service,resource-explorer-2}.
# tsx is pinned in production dependencies for standalone and full-source runs.
[[crons]]
name = "aws-discovery-runner"
schedule = "* * * * *"
command = "npx --yes tsx jobs/aws-discovery-runner.ts"

# Azure asset discovery drain — picks up queued AzureDiscoveryRun rows and
# runs them through @azure/{identity,arm-compute,arm-storage,arm-resources,
# arm-authorization}.
[[crons]]
name = "azure-discovery-runner"
schedule = "* * * * *"
command = "npx --yes tsx jobs/azure-discovery-runner.ts"

# GCP asset discovery drain — picks up queued GcpDiscoveryRun rows and runs
# them through google-auth-library + @google-cloud/{compute,storage,
# resource-manager}.
[[crons]]
name = "gcp-discovery-runner"
schedule = "* * * * *"
command = "npx --yes tsx jobs/gcp-discovery-runner.ts"

# Live threat-intel ingest — re-derives KEV/EPSS/VulnCheck state on the
# per-feed cadence (15m/1h/5m) and bumps findings' priorityScore. Each
# tick delegates to src/lib/business/scanner/live-rescore.ts so the cron
# itself stays small.
[[crons]]
name = "threat-intel-ingest"
schedule = "*/15 * * * *"
command = "npx --yes tsx jobs/threat-intel-ingest.ts"

# Trial lifecycle — sends the D-7 / D-1 / D-0 trial-expiry reminders.
# Idempotent per (workspace, day) by the trialEndsAt-derived day key.
# Delegates to src/lib/business/trial-reminders.ts so the cron stays small.
[[crons]]
name = "trial-reminders"
schedule = "0 9 * * *"
command = "npx --yes tsx jobs/trial-reminders.ts"

# Per-team scheduled cloud discovery runs — drains every
# CloudDiscoverySchedule whose nextRunAt <= now, dispatches each team
# connection through the same business lib backing
# /api/v1/{aws,azure,gcp}/discover, then stamps the schedule forward.
[[crons]]
name = "cloud-discovery-run"
schedule = "* * * * *"
command = "npx --yes tsx jobs/cloud-discovery-run.ts"

# Trial first-scan nudge — hourly tick that nudges trial owners who
# signed up >= 24h ago and still haven't recorded a first_scan_triggered
# funnel event. Idempotent per (workspace, owner) via the
# lastFirstScanNudgeSentAt stamp column. Delegates to
# src/lib/business/trial-first-scan-nudge.ts so the cron stays small.
[[crons]]
name = "trial-first-scan-nudge"
schedule = "0 * * * *"
command = "npx --yes tsx jobs/trial-first-scan-nudge.ts"

# Alert email dispatch — drains Alert rows where dispatchedAt IS NULL
# and createdAt <= now - 60s, emails each row's team admin Membership
# recipients via the alertEmail template, then stamps dispatchedAt.
# Selection + send in src/lib/business/alerts-dispatch.ts; cron stays
# small. Per-row error isolation: one bad admin does not abort the rest
# of the batch.
[[crons]]
name = "alert-dispatch"
schedule = "*/5 * * * *"
command = "npx --yes tsx jobs/alert-dispatch.ts"

# Nightly competitive-intelligence audit — for every Team, re-runs the
# audit and inserts a `CompetitiveIntelRun` row keyed on
# `(teamId, ranAt)` so a re-fire within the same UTC day is a no-op.
# Selection + insert + LLM call live in
# src/lib/business/competitive-intel.ts; cron stays small. Per-team
# error isolation: one bad team does not abort the rest of the batch.
[[crons]]
name = "competitive-intel-run"
schedule = "0 2 * * *"
command = "npx --yes tsx jobs/competitive-intel-run.ts"

# Nightly alert digest — aggregates the last 24h of severity IN
# ('critical','high') AND acknowledgedAt IS NULL Alert rows into one email
# per active WorkspaceMember of every Team where digestEnabled != false.
# One envelope per team (per UTC day); idempotency via Team.lastAlertDigestAt
# calendar-day stamp. All-clear branch fires when the window has zero rows
# and stamp advances. Selection + send live in
# src/lib/business/alerts-digest.ts; cron stays small. Per-team error
# isolation: one bad team does not abort the rest of the batch.
[[crons]]
name = "alert-digest"
schedule = "0 7 * * *"
command = "npx --yes tsx jobs/alert-digest.ts"

# Daily CVE velocity trend signal - fires at 06:00 UTC, 1h BEFORE the
# 07:00 alert-digest so the digest can reference today's signal in
# downstream renderers. Reads the last 30d vs prior 30d of Alert rows
# per Team, derives the trend {velocity, acceleratingDeclines, hotspots},
# then upserts a VulnerabilityTrend row keyed on (workspaceId, windowStart)
# so a same-day re-run collapses to one row. Selection + write live in
# src/lib/business/alerts-trend.ts; cron stays small. Per-team error
# isolation: one bad team does not abort the rest of the batch.
[[crons]]
name = "alerts-trend"
schedule = "0 6 * * *"
command = "npx --yes tsx jobs/alerts-trend.ts"

# Weekly AI-generated risk-trend digest — 08:00 UTC Monday tick (2h
# AFTER the 06:00 alerts-trend so today's signal is fresh), reads each
# Team's last-7d vs prior-7d Alert slice + latest VulnerabilityTrend,
# asks the platform Agent API to draft an executive analyst digest,
# then emails the rendered HTML to every active WorkspaceMember via
# the email proxy. Selection + prompt + send + DigestLog write live in
# src/lib/business/weekly-risk-digest.ts; cron stays small. Per-team
# error isolation: one bad team does not abort the rest of the batch.
# Idempotency is via (workspaceId, weekStart, triggeredBy) on DigestLog
# so a second Monday tick is a no-op.
[[crons]]
name = "weekly-risk-digest"
schedule = "0 8 * * 1"
command = "npx --yes tsx jobs/weekly-risk-digest.ts"

# 09:00 UTC daily alert digest — complements the 07:00 nightly
# critical/high digest with a broader every-severity summary of
# alerts that were EITHER created OR had their status transition in
# the last 24h. Renders one email per Team per UTC day with
# per-severity count lines + per-row /alerts?ownedByMe=1 deep links.
# Selection + send live in
# src/lib/business/daily-alert-digest.ts; cron stays small. Per-team
# error isolation: one bad team does not abort the rest of the batch.
# Idempotency is via Team.lastDailyDigestAt (separate from the
# nightly stamp) so the 07:00 + 09:00 cadences cannot silence each
# other on a busy day.
[[crons]]
name = "daily-alert-digest"
schedule = "0 9 * * *"
command = "npx --yes tsx jobs/daily-alert-digest.ts"

# Per-user 08:30 UTC daily digest — emails each opted-in user one
# envelope per UTC day summarising alerts created in the last 24
# hours whose ownerId matches the user OR is null (unassigned,
# waiting to be picked up). Per-user "Receive daily digest" toggle
# on /account controls opt-in (DailyDigestPrefs.enabled, default
# true). Subject prefix `[daily digest]`, per-row deep links to
# /alerts/[id]. Selection + send in
# src/lib/business/daily-user-digest.ts; cron stays small. Per-user
# error isolation: one bad recipient does not abort the rest of the
# batch. Idempotency is via DailyDigestPrefs.lastSentAt (separate
# from Team.lastDailyDigestAt) so the per-user and per-team cadences
# cannot silence each other on a busy day. Slot chosen to interleave
# with the 06:00 alerts-trend, 07:00 alert-digest, 09:00
# daily-alert-digest, and Monday-only 08:00 weekly-risk-digest so no
# two cron entries collide on the same tick.
[[crons]]
name = "daily-user-digest"
schedule = "30 8 * * *"
command = "npx --yes tsx jobs/daily-user-digest.ts"
